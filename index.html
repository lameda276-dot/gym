<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gym</title>
<style>
:root{
  --bg:#000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;
  --tx:#fff;--tx2:rgba(235,235,245,.6);--tx3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);
  --red:#ff375f;--orange:#ff9f0a;--green:#30d158;--blue:#0a84ff;--cyan:#64d2ff;--purple:#bf5af2;--yellow:#ffd60a;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--tabh:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);min-height:100vh;
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
svg{display:block}
body.lock{overflow:hidden}

/* ───── barras fijas ───── */
#sbar{position:fixed;top:0;left:0;right:0;height:var(--st);background:#000;z-index:31}
#top{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(44px + var(--st));padding-top:var(--st);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;
  background:rgba(0,0,0,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep)}
#top.on{opacity:1}
#top b{font-size:17px;font-weight:600}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;padding-bottom:var(--sb);
  background:rgba(22,22,24,.8);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--sep)}
#tabs button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--tx3);font-size:10.5px;font-weight:600}
#tabs button svg{width:26px;height:26px}
#tabs button.on{color:var(--orange)}

main{padding:calc(var(--st) + 10px) 16px calc(var(--tabh) + var(--sb) + 28px);max-width:620px;margin:0 auto}
body.timer main{padding-bottom:calc(var(--tabh) + var(--sb) + 104px)}
.view.anim{animation:entra .3s ease both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ───── tipografía ───── */
.eyebrow{font-size:13px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;margin-top:8px;min-height:18px}
h1.lt{font-size:34px;font-weight:800;letter-spacing:-.022em;line-height:1.08;margin:2px 0 16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:21px;font-weight:700;letter-spacing:-.01em;margin:26px 2px 10px}
.sec small{font-size:15px;font-weight:500;color:var(--tx2);letter-spacing:0}
.hint{color:var(--tx2);font-size:14px;line-height:1.5;padding:4px 4px 10px;text-align:center}
.p{color:var(--tx2);font-size:15px;line-height:1.5;margin-bottom:14px}

/* ───── bloques ───── */
.card{background:var(--s1);border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.press{transition:transform .15s}
.press:active{transform:scale(.975)}
.bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.bar.big{height:10px;border-radius:5px;margin-top:14px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--green));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--s2);font-size:13px;font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:15px;background:var(--s1);
  font-size:17px;font-weight:600;margin-bottom:10px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.pri{background:var(--orange);color:#000}
.btn.ok{background:var(--green);color:#000}
.btn.dng{color:var(--red)}
.btn.s2{background:var(--s2)}
.btn:disabled{opacity:.35;transform:none}
#sh .btn:not(.pri):not(.ok){background:var(--s2)}
.ban{display:flex;gap:12px;align-items:center;background:rgba(255,214,10,.12);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14.5px;line-height:1.38}
.ban span{flex:1}
.ban b{color:var(--yellow)}
.ban button{flex:0 0 auto;color:var(--yellow);font-weight:700;padding:6px 2px}
.empty{color:var(--tx2);text-align:center;padding:26px 14px;font-size:15px;line-height:1.55}

/* ───── anillos ───── */
.rings{display:flex;align-items:center;gap:18px}
.rings svg{flex:0 0 132px;width:132px;height:132px}
.anim .rg{animation:rg 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rg{from{stroke-dashoffset:var(--c)}}
.leg{flex:1;display:flex;flex-direction:column;gap:11px;min-width:0}
.leg small{display:block;font-size:13px;font-weight:600;color:var(--c)}
.leg b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.leg b span{font-size:14px;color:var(--tx2);font-weight:600;letter-spacing:0}

/* ───── ventana de comida ───── */
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vbig{font-size:26px;font-weight:700;letter-spacing:-.015em;margin-top:10px;font-variant-numeric:tabular-nums}
.tl{position:relative;height:10px;background:var(--s2);border-radius:5px;margin:16px 0 7px}
.tl .w{position:absolute;top:0;bottom:0;background:var(--green);opacity:.8;border-radius:5px}
.tl .m{position:absolute;top:2px;width:6px;height:6px;border-radius:50%;background:#000;transform:translateX(-50%)}
.tl .n{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px var(--s1);transform:translateX(-50%)}
.tlx{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.vfoot{font-size:13px;color:var(--tx2);margin-top:9px}

/* ───── semana ───── */
.wk{display:flex;justify-content:space-between;margin-top:14px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--tx2)}
.wk i{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
.wk i.on{background:var(--green);color:#000}
.wk i.hoy{box-shadow:0 0 0 2px var(--orange)}
.wk i svg{width:18px;height:18px}

/* ───── listas estilo iOS ───── */
.list{background:var(--s1);border-radius:20px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;position:relative;width:100%}
.row+.row::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:.5px solid var(--sep)}
.list.flat .row+.row::before{left:16px}
.row:active{background:var(--s2)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 30px;font-size:15px;background:var(--c);color:#fff}
.ico svg{width:18px;height:18px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:500;font-size:16.5px;line-height:1.25}
.row .tx small{display:block;color:var(--tx2);font-size:13.5px;margin-top:1px}
.chk{width:27px;height:27px;border-radius:50%;border:2px solid var(--s3);display:grid;place-items:center;flex:0 0 27px;transition:background .2s,border-color .2s}
.chk.on{background:var(--green);border-color:var(--green);color:#000}
.chk svg{width:15px;height:15px}
.chev{color:var(--tx3);width:18px;height:18px;flex:0 0 18px}
.val{color:var(--tx2);font-size:16px;font-variant-numeric:tabular-nums}

/* ───── entreno ───── */
.seg{display:flex;background:var(--s1);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--tx2);position:relative;text-align:center}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.seg button i{position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.prog{margin-bottom:16px}
.prog .pt{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--tx2);margin-bottom:8px}
.prog .pt b{color:var(--tx);font-size:20px;font-variant-numeric:tabular-nums}
.ex{background:var(--s1);border-radius:20px;padding:14px;margin-bottom:12px;transition:background .3s}
.ex.done{background:linear-gradient(180deg,rgba(48,209,88,.17),rgba(48,209,88,.05)),var(--s1)}
.exh{display:flex;align-items:flex-start;gap:11px}
.badge{flex:0 0 30px;height:30px;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--tx2);transition:.25s}
.ex.done .badge{background:var(--green);color:#000}
.badge svg{width:16px;height:16px}
.exn{flex:1;min-width:0}
.exn b{display:block;font-size:17px;font-weight:600;line-height:1.25}
.exn small{display:block;color:var(--tx2);font-size:14px;margin-top:2px}
.ib{width:34px;height:34px;margin:-3px -4px 0 0;border-radius:50%;display:grid;place-items:center;color:var(--tx2)}
.ib svg{width:22px;height:22px}
.ult{display:inline-block;margin-top:10px;font-size:13px;color:var(--tx2);background:var(--s2);border-radius:9px;padding:6px 10px}
.stp{display:flex;align-items:center;gap:8px;margin:12px 0}
.stp button{height:46px;border-radius:13px;background:var(--s2);display:grid;place-items:center}
.stp .pm{width:54px;color:var(--orange)}
.stp .pm svg{width:20px;height:20px}
.stp .pv{flex:1;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.stp button:active{background:var(--s3)}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:8px}
.set{height:62px;border-radius:15px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .14s,background .2s;text-align:center}
.set span{font-size:20px;font-weight:700;line-height:1}
.set small{font-size:11.5px;color:var(--tx2);font-weight:600}
.set svg{width:22px;height:22px}
.set.on{background:var(--green);color:#000}
.set.on small{color:rgba(0,0,0,.55)}
.set:active{transform:scale(.9)}
.set.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.1)}}

.sube{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 9px 9px 12px;border-radius:13px;background:rgba(48,209,88,.14);font-size:14.5px}
.sube span{flex:1;min-width:0}
.sube b{color:var(--green)}
.sube button{flex:0 0 auto;height:34px;padding:0 14px;border-radius:10px;background:var(--green);color:#000;font-weight:700;font-size:14.5px}
.stp .pv.solo{flex:1}

/* ───── guía visual ───── */
.gv{position:relative;aspect-ratio:3/2;border-radius:16px;overflow:hidden;background:var(--s2);margin-bottom:12px}
.gv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gv img.b{animation:alt 1.8s infinite}
@keyframes alt{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
.gv.off::after{content:"La foto aparece cuando abras la app con internet";position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;font-size:14px;color:var(--tx2)}
.gv.off img{display:none}
.gnota{font-size:13.5px;color:var(--tx2);margin:-4px 2px 12px;line-height:1.45}
.yt{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;background:var(--s2);color:var(--red);font-weight:600;font-size:16px;text-decoration:none;margin-bottom:10px}
.yt svg{width:20px;height:20px}

/* ───── unidad de peso ───── */
.seg.u{margin-bottom:12px;background:var(--s2)}
.seg.u button{font-size:13px;height:38px;padding:0 2px}
.seg.u button.on{background:var(--s3)}

/* ───── resumen semanal ───── */
.res{background:linear-gradient(160deg,rgba(255,159,10,.2),rgba(255,55,95,.08)),var(--s1)}
.res .m3{margin:12px 0 0}
.res .m3 div{background:rgba(255,255,255,.07)}
.res .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;color:var(--tx2)}
.res .x svg{width:14px;height:14px}

/* ───── arsenal y cambios ───── */
.camb{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--purple)}
.srch{width:100%;background:var(--s2);border:0;outline:0;border-radius:12px;padding:11px 14px;font-size:16px;color:var(--tx);margin-bottom:10px}
.gch{display:flex;gap:7px;overflow-x:auto;margin:0 -18px 12px;padding:0 18px;scrollbar-width:none}
.gch::-webkit-scrollbar{display:none}
.gch button{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--s2);font-size:14px;font-weight:600;color:var(--tx2)}
.gch button.on{background:var(--tx);color:#000}
.lh{font-size:12.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;margin:14px 4px 7px}
.ars{background:var(--s2);border-radius:15px;overflow:hidden}
.ars button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;position:relative}
.ars button+button::before{content:"";position:absolute;top:0;left:68px;right:0;border-top:.5px solid var(--sep)}
.ars button:active{background:var(--s3)}
.ars img,.ars .ni{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--s3);flex:0 0 44px}
.ars .ni{display:grid;place-items:center;color:var(--tx3);font-size:18px}
.ars .tx{flex:1;min-width:0}
.ars .tx b{display:block;font-size:15.5px;font-weight:500;line-height:1.25}
.ars .tx small{color:var(--tx2);font-size:12.5px}
.vol{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:14px;background:rgba(191,90,242,.14);color:var(--purple);font-weight:600;margin-bottom:12px;font-size:15px}
.ta2{width:100%;min-height:84px;background:var(--s3);border:0;outline:0;border-radius:11px;padding:11px 12px;font-size:15px;color:var(--tx);resize:none}

/* ───── timer ───── */
#timer{position:fixed;left:16px;right:16px;bottom:calc(var(--tabh) + var(--sb) + 10px);max-width:480px;margin:0 auto;z-index:45;
  display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:22px;
  background:rgba(44,44,46,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 12px 32px rgba(0,0,0,.55);
  transform:translateY(150%);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.2,.9,.25,1),opacity .2s,background .3s}
#timer.on{transform:none;opacity:1;pointer-events:auto}
#timer svg{width:42px;height:42px;flex:0 0 42px}
#timer .tt{flex:1;min-width:0}
#timer .tt small{display:block;font-size:12px;color:var(--tx2);font-weight:600}
#timer .tt b{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
#timer button{height:40px;padding:0 14px;border-radius:13px;background:var(--s3);font-size:15px;font-weight:600}
#timer.fin{background:rgba(48,209,88,.96);color:#000}
#timer.fin .tt small{color:rgba(0,0,0,.6)}
#timer.fin button{background:rgba(0,0,0,.15)}
#timer.fin #tarc,#timer.fin #ttrk{stroke:#000}

/* ───── comida ───── */
.dnav{display:flex;align-items:center;gap:4px;margin-left:-6px}
.dnav button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--orange)}
.dnav button:disabled{color:var(--tx3)}
.dnav button svg{width:17px;height:17px}
.krow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kbig{font-size:44px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1}
.kbig span{font-size:16px;font-weight:600;color:var(--tx2);letter-spacing:0;margin-left:5px}
.ksub{font-size:15px;font-weight:600;margin-top:7px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.macros div{background:var(--s2);border-radius:13px;padding:9px 11px}
.macros small{display:block;font-size:12px;font-weight:600;color:var(--c)}
.macros b{font-size:18px;font-variant-numeric:tabular-nums}
.macros span{font-size:13px;color:var(--tx2);font-weight:600}
.comp{display:flex;align-items:flex-end;gap:8px;background:var(--s1);border-radius:24px;padding:6px 6px 6px 16px;margin-bottom:14px}
.comp textarea{flex:1;background:none;border:0;outline:0;resize:none;font-size:17px;line-height:1.35;padding:9px 0;max-height:124px;color:var(--tx)}
.comp textarea::placeholder{color:var(--tx3)}
.comp button{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#000;display:grid;place-items:center;flex:0 0 38px;transition:background .2s}
.comp button svg{width:20px;height:20px}
.comp button:disabled{background:var(--s3);color:var(--tx3)}
.clab{font-size:13px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;margin:0 4px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--s1);font-size:15px;font-weight:500;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--tx2);font-weight:500;margin-left:6px;font-size:13px}
.chip:active{background:var(--s2)}
.ent{display:flex;gap:12px;padding:13px 16px;align-items:flex-start;width:100%;position:relative}
.ent+.ent::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.ent:active{background:var(--s2)}
.ent .h{flex:0 0 42px;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;padding-top:2px}
.ent .tx{flex:1;min-width:0}
.ent .tx b{display:block;font-weight:500;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.ent .tx small{color:var(--green);font-size:13px;font-weight:600}
.ent .k{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap;padding-top:1px}

/* ───── progreso ───── */
.wbig{font-size:44px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1}
.wbig span{font-size:17px;color:var(--tx2);font-weight:600;margin-left:4px;letter-spacing:0}
.chart{width:100%;height:auto;margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:14px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.bars i{width:100%;border-radius:7px 7px 4px 4px;background:var(--cyan);min-height:4px;transition:height .5s}
.bars i.met{background:var(--green)}
.bars i.cero{background:var(--s2)}
.bars small{font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.bars em{font-style:normal;font-size:11px;font-weight:700;color:var(--tx2)}

/* ───── hoja (bottom sheet) ───── */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.52);opacity:0;pointer-events:none;transition:opacity .28s;z-index:60}
#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;z-index:61;background:var(--s1);border-radius:24px 24px 0 0;
  max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(20px + var(--sb));
  transform:translateY(105%);transition:transform .36s cubic-bezier(.2,.9,.25,1)}
#sh.on{transform:none}
.grab{position:sticky;top:0;padding:9px 0 12px;background:var(--s1);z-index:1}
.grab::after{content:"";display:block;margin:0 auto;width:38px;height:5px;border-radius:3px;background:var(--s3)}
#sh h2{font-size:23px;font-weight:700;letter-spacing:-.015em;margin:0 0 14px}
.pvw{background:var(--s2);border-radius:15px;overflow:hidden;margin-bottom:14px}
.pvw .r{display:flex;align-items:center;gap:10px;padding:11px 14px;position:relative}
.pvw .r+.r::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
.pvw .r .tx{flex:1;min-width:0}
.pvw .r .tx b{display:block;font-weight:600;font-size:16px}
.pvw .r .tx small{color:var(--tx2);font-size:13px}
.pvw .r .k{text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
.pvw .r .k b{display:block;font-size:16px}
.pvw .r .k small{color:var(--green);font-size:12.5px;font-weight:600}
.pvw .unk .tx b{color:var(--yellow)}
.pvw .unk button{color:var(--orange);font-weight:700;font-size:15px;padding:6px 2px}
.pvw .tot{background:rgba(255,159,10,.1)}
.pvw .tot .tx b{font-size:17px}
.teach{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 14px 14px}
.teach input{background:var(--s3);border:0;outline:0;border-radius:11px;padding:11px 12px;font-size:16px;color:var(--tx);width:100%}
.teach .full{grid-column:1/-1}
.teach button{grid-column:1/-1;height:44px;border-radius:12px;background:var(--orange);color:#000;font-weight:700;text-align:center}
.form{background:var(--s2);border-radius:15px;overflow:hidden;margin-bottom:14px}
.form label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 15px;min-height:50px;font-size:16px;position:relative}
.form label+label::before{content:"";position:absolute;top:0;left:15px;right:0;border-top:.5px solid var(--sep)}
.form input,.form select{background:none;border:0;outline:0;text-align:right;font-size:16px;color:var(--orange);width:52%;-webkit-appearance:none;appearance:none}
.form select{direction:rtl}
.calc{background:rgba(255,159,10,.1);border-radius:15px;padding:13px 15px;margin-bottom:14px;font-size:15px;line-height:1.5;color:var(--tx2)}
.calc b{color:var(--tx);font-variant-numeric:tabular-nums}
.ta{width:100%;min-height:96px;background:var(--s2);border:0;outline:0;border-radius:14px;padding:12px;font-size:14px;color:var(--tx);margin-bottom:10px;font-family:ui-monospace,Menlo,monospace}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.m3 div{background:var(--s2);border-radius:13px;padding:10px 12px}
.m3 small{display:block;font-size:12px;color:var(--tx2);font-weight:600}
.m3 b{font-size:17px;font-variant-numeric:tabular-nums}
.cue{font-size:17px;line-height:1.55;margin-bottom:16px}
.fin{font-size:46px;text-align:center;margin:4px 0 6px}
.bigin{width:100%;background:var(--s2);border:0;outline:0;border-radius:15px;padding:16px;font-size:26px;font-weight:700;text-align:center;color:var(--tx);margin-bottom:14px}

/* ───── toast ───── */
#toast{position:fixed;left:16px;right:16px;top:calc(var(--st) + 8px);max-width:480px;margin:0 auto;z-index:70;display:flex;align-items:center;gap:10px;
  padding:12px 12px 12px 16px;border-radius:17px;background:rgba(58,58,60,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  font-size:15px;font-weight:500;box-shadow:0 10px 28px rgba(0,0,0,.5);transform:translateY(calc(-100% - var(--st) - 20px));transition:transform .38s cubic-bezier(.2,.9,.25,1)}
#toast.on{transform:none}
#toast span{flex:1}
#toast button{color:var(--orange);font-weight:700;padding:4px 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function aliasRe(alias){
  const ws=alias.split(" ").map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+(w.length>2&&!/s$/.test(w)?"(?:es|s)?":""));
  return new RegExp("(^|[^a-z0-9_])("+ws.join("(?:\\s+|_)")+")(?=$|[^a-z0-9_])");
}
let INDICE=null;
function indice(){
  if(INDICE)return INDICE;
  const todos=ALIM.concat(DB.get(K.cus,[]));const L=[];
  for(const f of todos)for(const a of f.a.split("|")){const al=norm(a);if(al)L.push({f,al,re:aliasRe(al)})}
  L.sort((x,y)=>y.al.length-x.al.length);
  INDICE={L,comp:L.filter(x=>/\s(con|y)\s/.test(x.al)).map(x=>x.al)};
  return INDICE;
}
function buscar(t){
  let mejor=null;
  for(const x of indice().L){
    if(mejor&&x.al.length<mejor.al)break; // L va de largo a corto: ya no hay alias más largos
    const m=t.match(x.re);if(!m)continue;
    const i=m.index+m[1].length;
    if(!mejor||i<mejor.i)mejor={f:x.f,i,len:m[2].length,al:x.al.length};
  }
  return mejor;
}
function unidadDe(t){for(const U of UNI){const m=t.match(new RegExp("(^|[^a-z])("+U[1]+")(?=$|[^a-z])"));if(m)return{U,m:m[2]}}return null}
function cantidadDe(t){
  let q=null;const fr=t.match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+)/);
  if(fr)q=+fr[1]/+fr[2];
  else{const n=t.match(/\d+(?:\.\d+)?/);if(n)q=+n[0];
    else for(const[w,v]of NUMW)if(new RegExp("(^|\\s)"+w+"(\\s|$)").test(t)){q=v;break}}
  if(/ymedi[oa]/.test(t))q=(q||0)+.5;
  return q;
}
function parsear(texto){
  let t=norm(texto);
  for(const c of indice().comp)t=t.replace(new RegExp(c.replace(/ /g,"\\s+"),"g"),c.replace(/ /g,"_"));
  t=t.replace(/\by\s+medi([oa])\b/g,"_ymedi$1").replace(/(\d),(\d)/g,"$1.$2");
  const partes=t.split(/\s*(?:[,;+\n]|\by\b|\bcon\b|\bmas\b|\bademas\b)\s*/).map(s=>s.trim()).filter(Boolean);
  return partes.map(parte);
}
function parte(p){
  const vista=p.replace(/_/g," ");
  const mk=p.match(/(\d+(?:\.\d+)?)\s*(?:kcal|kilocalorias?|calorias?|cal)\b/);
  if(mk){
    const mp=p.match(/(\d+(?:\.\d+)?)\s*(?:g|gr|gramos)?\s*(?:de\s+)?prot\w*/);
    let n=p.replace(mk[0]," ");if(mp)n=n.replace(mp[0]," ");
    n=n.replace(/_/g," ").replace(/\b(de|del|con|el|la|un|una)\b/g," ").replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
    return{n:cap(n||"Comida"),q:"lo que dijiste",g:0,k:+mk[1],p:mp?+mp[1]:0,c:0,f:0,cu:1};
  }
  const m=buscar(p);
  if(!m)return{unk:1,txt:vista};
  const F=m.f;
  // "pastelitos de carne", "sopa de pollo": la carne es el relleno, no la comida. Mejor preguntar que adivinar.
  let antes=p.slice(0,m.i).replace(/_/g," ");
  for(const U of UNI)antes=antes.replace(new RegExp("(^|[^a-z])("+U[1]+")(?=$|[^a-z])","g"),"$1 ");
  for(const[w]of NUMW)antes=antes.replace(new RegExp("(^|\\s)"+w+"(?=\\s|$)","g")," ");
  antes=antes.replace(/\d+(\.\d+)?(\s*\/\s*\d+)?/g," ").replace(/\b(poco|poquito|chin|chorrito|pedacito|pedazo|bastante|mucho|algo|ymedio|ymedia)\b/g," ").replace(/\s+/g," ").trim();
  if(/[a-z]{3,}\s+(de|del|con)$/.test(antes))return{unk:1,txt:vista};
  let resto=(p.slice(0,m.i)+" "+p.slice(m.i+m.len)).replace(/_/g," ");
  const ud=unidadDe(resto);if(ud)resto=resto.replace(ud.m," ");
  let q=cantidadDe(resto);if(q===null||q<=0)q=1;
  const U=ud&&ud.U;let g,qt;
  if(U&&(U[0]==="g"||U[0]==="ml")){g=q;qt=fmtN(q)+" "+U[3]}
  else if(U&&(U[0]==="kg"||U[0]==="litro")){g=q*1000;qt=fmtN(q)+" "+U[3]}
  else{
    const key=U?U[0]:F.d;
    const pu=(F.u&&F.u[key]!=null)?F.u[key]:(U&&U[2]!=null?U[2]:F.u[F.d]);
    const Ue=UNI.find(x=>x[0]===key);
    g=q*pu;qt=fmtN(q)+(Ue&&Ue[3]!=="u."?" "+(q>1?Ue[4]:Ue[3]):"");
  }
  // cu=1 oculta el "· N g" en pantalla: en alimentos enseñados no hay gramos reales, y si escribió en g/ml ya se ven
  return{n:F.n,q:qt,g:Math.round(g),k:F.k*g/100,p:F.p*g/100,c:F.c*g/100,f:F.f*g/100,cu:(F.cu||(U&&/^(g|ml|kg|litro)$/.test(U[0])))?1:0};
}
function nombreDe(txt){
  let t=norm(txt);
  for(const U of UNI)t=t.replace(new RegExp("(^|[^a-z])("+U[1]+")(?=$|[^a-z])","g"),"$1 ");
  for(const[w]of NUMW)t=t.replace(new RegExp("(^|\\s)"+w+"(?=\\s|$)","g")," ");
  t=t.replace(/\d+(\.\d+)?(\s*\/\s*\d+)?/g," ").replace(/\s+/g," ").trim();
  t=t.replace(/^(de|del|la|el|los|las)\s+/,"").replace(/\s+(de|del)$/,"");
  return t.split(" ").map(w=>w.length>3&&/[^aeiou]s$|[aeiou]s$/.test(w)?w.replace(/s$/,""):w).join(" ");
}

/* ═══════════════ arsenal y cambios de ejercicio ═══════════════
   ARSENAL (arsenal.js) = ejercicios.md con sus cues + catálogo de free-exercise-db (cat:1).
   Un cambio reemplaza el ejercicio de un hueco (día:posición) y conserva series, reps y descanso.
   gym.cambios = {fijo:{"1:2":nombre}, hoy:{"2026-10-06:1:2":nombre}} */
const GRUPOS=["Espalda","Pecho","Hombro","Bíceps","Tríceps","Cuádriceps","Isquio y glúteo","Gemelo","Core"];
const NIV=[["x","Lo sé hacer"],["/","Sin dominar"],[" ","Por aprender"],["c","Catálogo"]];
const arsenal=()=>ARSENAL.concat(DB.get(K.ejc,[]));
const fichaDe=n=>arsenal().find(x=>x.n===n);

const cambios=()=>{const C=DB.get(K.cam,{});C.fijo=C.fijo||{};C.hoy=C.hoy||{};return C};
function rutinaDe(dia,f){
  const r=RUTINA[dia];if(!r)return null;
  const C=cambios(),s=DB.get(K.ses,{})[f];
  return Object.assign({},r,{e:r.e.map((x,i)=>{
    const kf=dia+":"+i,kh=f+":"+kf;let n=C.hoy[kh]||C.fijo[kf]||x.n;
    const se=s&&s.dia===dia&&s.ej[i];
    if(f<hoy()&&se&&se.hechas.length)n=se.n; // días pasados: lo que de verdad hizo
    if(n===x.n)return Object.assign({},x,{o:x.n});
    const F=fichaDe(n)||{n,c:""},enRut=Object.values(RUTINA).flatMap(d=>d.e).find(y=>y.n===n);
    return Object.assign({},x,{n,c:F.c||"",p:F.p||(enRut?enRut.p:""),o:x.n,cam:C.hoy[kh]===n?"hoy":"fijo"});
  })});
}
const R=()=>rutinaDe(entD,entF);
const seriesTot=r=>r.e.reduce((a,x)=>a+x.s,0);
const hechasSes=s=>s?s.ej.reduce((a,e)=>a+e.hechas.length,0):0;
const entrenoEn=f=>{const s=DB.get(K.ses,{})[f];return!!(s&&hechasSes(s))};
function marcar(f,dia,i,k){
  const S=DB.get(K.ses,{}),r=rutinaDe(dia,f);let s=S[f];
  if(!s||s.dia!==dia)s=S[f]={dia,t:r.t,ej:r.e.map(x=>({n:x.n,hechas:[],peso:null}))};
  while(s.ej.length<r.e.length)s.ej.push({n:r.e[s.ej.length].n,hechas:[],peso:null});
  const e=s.ej[i];if(e.n!==r.e[i].n){e.n=r.e[i].n;e.hechas=[]}e.meta=r.e[i].s;
  const on=!e.hechas.includes(k);
  e.hechas=on?e.hechas.concat(k).sort((a,b)=>a-b):e.hechas.filter(x=>x!==k);
  e.peso=pesoDe(r.e[i]);
  if(on){const now=Date.now();s.t0=s.t0||now;s.t1=now}
  if(!hechasSes(s))delete S[f];
  DB.set(K.ses,S);return on;
}
function ultimaVez(nombre,antes){
  const S=DB.get(K.ses,{});
  for(const f of Object.keys(S).filter(x=>x<antes).sort().reverse()){
    const e=S[f].ej.find(x=>x.n===nombre&&x.hechas.length);if(e)return{f,peso:e.peso,h:e.hechas.length}}
  return null;
}
function pasoPeso(ej,v,dir){
  v=normPeso(v);const u=unidad(v);
  if(u==="corp"||u==="txt")return v;
  if(u==="placas")return placas(Math.max(1,numDe(v)+dir));
  const m=v.match(/(\d+(?:[.,]\d+)?)/);if(!m)return v;
  const x=parseFloat(m[1].replace(",","."));
  const pierna=/leg press|sentadilla|talones/i.test(ej.n)&&!/c\/u|lado/i.test(v);
  // mancuernas livianas van de 1 en 1 (4 → 5 kg); +2,5 sobre 4 kg sería una mancuerna que no existe
  const liviana=u==="cu"&&x+(dir<0?-1:0)<10;
  const nv=Math.max(0,x+dir*(pierna?5:liviana?1:2.5));
  return v.replace(m[1],fmtN(nv));
}

// "Toca subir": las dos últimas sesiones con este ejercicio (de cualquier día) tienen todas
// sus series hechas, con el mismo peso, y ese peso es el que está puesto hoy.
function tocaSubir(ej,antes){
  const pv=pesoDe(ej),u=unidad(pv);if(u==="corp"||u==="txt")return null;
  const S=DB.get(K.ses,{}),ult=[];
  for(const f of Object.keys(S).filter(x=>x<antes).sort().reverse()){
    const s=S[f],r=RUTINA[s.dia],e=s.ej.find(x=>x.n===ej.n&&x.hechas.length);if(!e)continue;
    const meta=e.meta||(r&&(r.e.find(x=>x.n===ej.n)||{}).s);
    ult.push({ok:!!meta&&e.hechas.length>=meta,p:normPeso(e.peso)});
    if(ult.length===2)break;
  }
  if(ult.length<2||!ult.every(x=>x.ok&&x.p===pv))return null;
  const nv=pasoPeso(ej,pv,1);return nv!==pv?nv:null;
}

/* ═══════════════ sensaciones: háptica, sonido, pantalla ═══════════════ */
function hap(){
  try{if(navigator.vibrate){navigator.vibrate(10);return}
    // iOS 18+: alternar un <input switch> produce vibración del Taptic Engine
    const l=document.createElement("label");l.ariaHidden="true";l.style.display="none";
    const i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");
    l.appendChild(i);document.head.appendChild(l);l.click();document.head.removeChild(l);
  }catch(e){}
}
let AC=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function sonar(){
  if(!AC)return;
  try{[0,.18].forEach(t0=>{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    o.type="sine";o.frequency.value=t0?1175:880;const t=AC.currentTime+t0;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.start(t);o.stop(t+.25)})}catch(e){}
}
let WL=null;
async function wake(on){
  try{if(on&&!WL&&"wakeLock"in navigator){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}
      else if(!on&&WL){await WL.release();WL=null}}catch(e){}
}

let tInt=null,tFin=0,tTot=1;
const TC=2*Math.PI*17;
function arrancarTimer(seg,lbl){
  tTot=seg*1000;tFin=Date.now()+tTot;$("#tlbl").textContent=lbl||"Descanso";
  const T=$("#timer");T.classList.remove("fin");T.classList.add("on");document.body.classList.add("timer");

  if(q<=0){clearInterval(tInt);tInt=null;sonar();hap();$("#timer").classList.add("fin");$("#tlbl").textContent="A la siguiente serie";
    setTimeout(()=>{if(!tInt)pararTimer()},2600)}

// Resumen de la semana pasada: sale la primera vez que abre la app en una semana nueva, el día que sea
// (los lunes falla, así que no se ata al lunes), y se queda en Hoy hasta que lo cierre.
const ultimoHasta=(o,f)=>{const ks=Object.keys(o).filter(k=>k<=f).sort();return ks.length?o[ks[ks.length-1]]:null};
function resumen(){
  const lun=addD(lunesDe(hoy()),-7),dom=addD(lun,6);
  if(DB.get(K.rv,"")>=lun)return null;
  const C=DB.get(K.com,{}),bw=DB.get(K.bw,{}),ci=DB.get(K.cin,{});
  let ent=0,dc=0,kc=0,pr=0;
  for(let d=0;d<7;d++){const f=addD(lun,d);if(entrenoEn(f))ent++;if(C[f]&&C[f].length){const t=totDia(f);dc++;kc+=t.k;pr+=t.p}}
  // contra el último dato de antes de la semana; si no hay, contra el primero de la semana
  const dif=o=>{const en=Object.keys(o).filter(k=>k>=lun&&k<=dom).sort();if(!en.length)return null;
    const a=ultimoHasta(o,addD(lun,-1));return a!=null?o[en[en.length-1]]-a:en.length>1?o[en[en.length-1]]-o[en[0]]:null};
  const dp=dif(bw),dcm=dif(ci);
  if(!ent&&!dc&&dp===null&&dcm===null)return null;
  return{lun,dom,ent,dc,kc:dc?kc/dc:0,pr:dc?pr/dc:0,dp,dcm};
}
function cerrarResumen(){hap();const R=resumen();if(R)DB.set(K.rv,R.lun);render()}
function tarjetaResumen(){
  const R=resumen();if(!R)return"";
  const sg=(v,u)=>v===null?"—":(v<=0?"−":"+")+fmt1(Math.abs(v))+" "+u;
  return'<div class="card res"><button class="x" onclick="cerrarResumen()">'+IC.x+'</button><div style="font-size:13px;font-weight:600;color:var(--orange)">Tu semana pasada · '+dm(R.lun)+" al "+dm(R.dom)+'</div>'+
    '<div style="font-size:24px;font-weight:800;letter-spacing:-.015em;margin-top:6px">'+R.ent+" de 3 entrenos"+(R.ent>=3?" ✓":"")+'</div>'+
    '<div class="m3"><div><small>Kcal / día</small><b>'+(R.dc?fmt(R.kc):"—")+'</b></div><div><small>Proteína</small><b>'+(R.dc?Math.round(R.pr)+" g":"—")+'</b></div><div><small>Peso</small><b>'+sg(R.dp,"kg")+'</b></div></div>'+
    '<div class="hint" style="text-align:left;padding:10px 0 0">'+(R.dc?"Promedio de "+R.dc+(R.dc===1?" día":" días")+" con comida anotada.":"No anotaste comida esa semana.")+(R.dcm!==null?" Cintura "+sg(R.dcm,"cm")+".":"")+"</div></div>";
}

function diaEnt(d){hap();entD=d;entF=addD(lunesDe(hoy()),d-1);render()}
function vEntreno(){
  if(entD===null){entD=new Date().getDay();entF=hoy()}
  const r=R(),S=DB.get(K.ses,{}),s=S[entF],lun=lunesDe(hoy()),futuro=entF>hoy();
  const seg=[1,2,3,4,5].map(d=>{const fd=addD(lun,d-1);return'<button class="'+(d===entD?"on":"")+'" onclick="diaEnt('+d+')">'+DC[d]+(entrenoEn(fd)?"<i></i>":"")+"</button>"}).join("");
  let h='<div class="eyebrow">'+(entF===hoy()?"Hoy · ":"")+fechaLarga(entF)+'</div><h1 class="lt">'+(r?esc(r.t):"Día libre")+'</h1><div class="seg">'+seg+"</div>";
  if(!r)return[h+'<div class="card empty">Sábado y domingo libres.<br>Elige un día arriba para ver o anotar esa sesión.</div>',"Entreno"];
  const tot=seriesTot(r),hec=hechasSes(s);
  h+='<div class="prog"><div class="pt"><span><b>'+hec+"</b> de "+tot+" series</span><span>"+r.min+' min</span></div><div class="bar"><i style="width:'+(hec/tot*100)+'%"></i></div></div>';
  if(futuro)h+='<div class="ban"><span><b>Ese día todavía no llega.</b> Puedes ver la rutina, no marcar series.</span></div>';
  h+=r.e.map((ej,i)=>{
    const hs=s&&s.ej[i]&&s.ej[i].n===ej.n?s.ej[i].hechas:[],done=hs.length>=ej.s,u=ultimaVez(ej.n,entF),pv=pesoDe(ej),corp=unidad(pv)==="corp";
    const sb=!futuro&&!hs.length?tocaSubir(ej,entF):null;
    const sets=Array.from({length:ej.s},(_,k)=>{const on=hs.includes(k);
      return'<button class="set'+(on?" on":"")+'" id="s'+i+"_"+k+'" onclick="serie('+i+","+k+')"'+(futuro?" disabled":"")+">"+(on?IC.check:"<span>"+(k+1)+"</span>")+"<small>"+esc(ej.r)+(/s$/.test(ej.r)?"":" reps")+"</small></button>"}).join("");
    return'<div class="ex'+(done?" done":"")+'"><div class="exh"><div class="badge">'+(done?IC.check:i+1)+'</div><div class="exn"><b>'+esc(ej.n)+"</b><small>"+ej.s+" × "+esc(ej.r)+" · descanso "+ej.d+" s</small>"+(ej.cam?'<span class="camb">'+(ej.cam==="hoy"?"Solo hoy":"Cambiado")+" · en vez de "+esc(ej.o)+"</span>":"")+'</div><button class="ib" onclick="cambiar('+i+')">'+IC.cambio+'</button><button class="ib" onclick="tecnica('+i+')">'+IC.info+"</button></div>"+
      (u?'<div class="ult">Última vez · '+dm(u.f)+" · "+esc(normPeso(u.peso)||"—")+" · "+u.h+(u.h===1?" serie":" series")+"</div>":"")+
      (sb?'<div class="sube"><span><b>Toca subir</b> · '+esc(sb)+'</span><button onclick="subir('+i+')">Subir</button></div>':"")+
      '<div class="stp">'+(corp?'<button class="pv solo" onclick="editarPeso('+i+')">Peso corporal</button>':
        '<button class="pm" onclick="pesoPaso('+i+',-1)">'+IC.menos+'</button><button class="pv" onclick="editarPeso('+i+')">'+(pv?esc(pv):'<span style="color:var(--tx2);font-weight:600">Poner peso</span>')+'</button><button class="pm" onclick="pesoPaso('+i+',1)">'+IC.mas+"</button>")+"</div>"+
      '<div class="sets">'+sets+"</div></div>";
  }).join("");
  h+='<button class="btn pri" onclick="terminar()"'+(hec?"":" disabled")+">Terminar entreno</button>";
  h+='<div class="hint">El primer ejercicio es sagrado. Si no da el tiempo, recorta por el final.</div>';
  return[h,r.t];
}
function serie(i,k){
  if(entF>hoy()){toast("Ese día todavía no llega");return}
  audio();hap();
  const on=marcar(entF,entD,i,k),r=R();render();
  if(!on)return;
  const b=$("#s"+i+"_"+k);if(b)b.classList.add("pop");
  if(entF===hoy())wake(true);
  const s=DB.get(K.ses,{})[entF],tot=seriesTot(r),hec=hechasSes(s);
  if(hec>=tot){pararTimer();setTimeout(terminar,350);return}
  const ej=r.e[i],exDone=s.ej[i].hechas.length>=ej.s;
  arrancarTimer(ej.d,exDone?"Descanso · sigue "+(r.e[i+1]?r.e[i+1].n.replace(/\s*\(.*?\)/,""):"el siguiente"):"Descanso");
}
function pesoPaso(i,dir){hap();const ej=R().e[i];setPeso(ej.n,pasoPeso(ej,pesoDe(ej),dir));render()}
function subir(i){const ej=R().e[i],nv=tocaSubir(ej,entF);if(!nv)return;hap();setPeso(ej.n,nv);render();toast("Subido a "+nv)}
const UNIS=[["kg","Kg"],["lado","Kg/lado"],["cu","Kg c/u"],["placas","Placas"],["corp","Corporal"]];
let PU=null;
function editarPeso(i){
  const ej=R().e[i],pv=pesoDe(ej),u=unidad(pv);
  PU={i,u:u==="txt"?"kg":u};
  hoja('<h2>'+esc(ej.n)+'</h2><div class="seg u" id="pU">'+UNIS.map(([k,l])=>'<button data-u="'+k+'" onclick="pesoU(\''+k+'\')">'+l+"</button>").join("")+"</div>"+
    '<input id="pIn" class="bigin" type="text" inputmode="decimal" value="'+(numDe(pv)==null?"":fmtN(numDe(pv)))+'" autocomplete="off">'+
    '<p class="p" id="pAy"></p>'+
    '<button class="btn pri" onclick="guardarPeso()">Guardar</button><button class="btn s2" onclick="cerrar()">Cancelar</button>');
  pesoU(PU.u,1);
  if(u!=="corp")setTimeout(()=>{const x=$("#pIn");if(x){x.focus();x.select()}},350);
}
function pesoU(u,quieto){
  if(!quieto)hap();PU.u=u;
  document.querySelectorAll("#pU button").forEach(b=>b.classList.toggle("on",b.dataset.u===u));
  $("#pIn").style.display=u==="corp"?"none":"";$("#pIn").inputMode=u==="placas"?"numeric":"decimal";
  $("#pAy").textContent={kg:"Lo que marca la barra, la máquina o la mancuerna.",lado:"Los discos de un solo lado. La barra o el brazo de la máquina no se cuentan.",
    cu:"Lo que pesa cada mancuerna.",placas:"Cuántas placas del pin, contando desde arriba. Los botones suben de una en una.",corp:"Sin peso extra. Se quitan los botones de subir y bajar."}[u];
}
function guardarPeso(){
  const ej=R().e[PU.i],n=parseFloat(($("#pIn").value||"").replace(",","."));
  if(PU.u!=="corp"&&!(n>0)){toast("Pon un número");return}
  const v=armarPeso(PU.u,n);setPeso(ej.n,v);cerrar();render();toast("Peso · "+v);
}
const fotoEj=(id,n)=>"ej/"+id+"_"+n+".jpg";
function guiaHTML(g){
  return g&&g.i?'<div class="gv" id="gv">'+(g.uno?"":'<img src="'+fotoEj(g.i,0)+'" alt="">')+'<img'+(g.uno?"":' class="b"')+' src="'+fotoEj(g.i,1)+'" alt="'+esc(g.n)+'"></div>'+(g.nota?'<p class="gnota">'+esc(g.nota)+"</p>":""):"";
}
const ytHTML=(g,n)=>'<a class="yt" href="https://www.youtube.com/results?search_query='+encodeURIComponent("como hacer "+(g&&g.q?g.q:n))+'" target="_blank" rel="noopener">'+IC.play+"Ver videos</a>";
const fotoFallo=()=>document.querySelectorAll("#gv img").forEach(im=>im.onerror=()=>{const g=$("#gv");if(g)g.classList.add("off")});
function tecnica(i){
  const ej=R().e[i],gv=guiaHTML(fichaDe(ej.n));
  hoja('<h2>'+esc(ej.n)+'</h2>'+gv+'<div class="m3"><div><small>Series</small><b>'+ej.s+" × "+esc(ej.r)+'</b></div><div><small>Descanso</small><b>'+ej.d+' s</b></div><div><small>Peso</small><b>'+esc(pesoDe(ej))+'</b></div></div>'+
    '<p class="cue">'+esc(ej.c)+'</p>'+
    ytHTML(fichaDe(ej.n),ej.n)+'<button class="btn s2" onclick="cerrar()">Entendido</button>');
  fotoFallo();
}

/* ═══════════════ CAMBIAR EJERCICIO · ARSENAL ═══════════════ */
// SW.i = hueco que se cambia (-1 = solo mirar el arsenal) · SW.g = grupo · SW.q = búsqueda
let SW=null;
const miniatura=F=>F.i?'<img loading="lazy" src="ej/t/'+F.i+'.jpg" alt="">':'<div class="ni">'+IC.lista+"</div>";
function cambiar(i){
  const ej=R().e[i],S=DB.get(K.ses,{})[entF];
  if(S&&S.ej[i]&&S.ej[i].n===ej.n&&S.ej[i].hechas.length){toast("Ya marcaste series de este ejercicio");return}
  hap();const F=fichaDe(ej.o)||fichaDe(ej.n);
  SW={i,g:F?F.g:"Espalda",q:""};abrirArsenal();
}
function verArsenal(){SW={i:-1,g:"Espalda",q:""};abrirArsenal()}
function abrirArsenal(){
  let h;
  if(SW.i>=0){const ej=R().e[SW.i];
    h='<h2>Cambiar '+esc(ej.n)+'</h2><p class="p" style="margin-bottom:10px">Se quedan las '+ej.s+" series de "+esc(ej.r)+" y "+ej.d+" s de descanso.</p>"+
      (ej.cam?'<button class="vol" onclick="aplicar(\''+jsq(ej.o)+'\',\'fijo\')">'+IC.cambio+"Volver a "+esc(ej.o)+"</button>":"");
  }else h='<h2>Arsenal</h2><p class="p" style="margin-bottom:10px">'+arsenal().length+' ejercicios. Toca uno para ver cómo se hace y marcar si ya lo dominas.</p>';
  h+='<input id="aQ" class="srch" placeholder="Buscar en todos" autocomplete="off" value="'+esc(SW.q)+'">'+
     '<div class="gch" id="aG">'+GRUPOS.map(g=>'<button data-g="'+g+'">'+g+"</button>").join("")+'</div><div id="aL"></div>'+
     (SW.i<0?'<button class="btn" style="margin-top:14px" onclick="crearEj()">Crear ejercicio</button>':"")+
     '<button class="btn s2" style="margin-top:'+(SW.i<0?0:14)+'px" onclick="cerrar()">Cerrar</button>';
  hoja(h);
  $("#aQ").oninput=e=>{SW.q=e.target.value;pintarArsenal()};
  document.querySelectorAll("#aG button").forEach(b=>b.onclick=()=>{hap();SW.g=b.dataset.g;SW.q="";$("#aQ").value="";pintarArsenal()});
  pintarArsenal();
}
const jsq=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
function pintarArsenal(){
  const q=norm(SW.q),act=SW.i>=0?R().e[SW.i].n:null;
  document.querySelectorAll("#aG button").forEach(b=>b.classList.toggle("on",!q&&b.dataset.g===SW.g));
  let L=arsenal().filter(F=>F.n!==act&&(q?norm(F.n).includes(q):F.g===SW.g));
  const fila=F=>'<button onclick="fichaEj(\''+jsq(F.n)+'\')">'+miniatura(F)+'<div class="tx"><b>'+esc(F.n)+"</b>"+(q?"<small>"+F.g+"</small>":"")+"</div>"+IC.chev+"</button>";
  let h="";
  for(const[k,l]of NIV){const G=L.filter(F=>nivelDe(F)===k);if(G.length)h+='<div class="lh">'+l+" · "+G.length+'</div><div class="ars">'+G.map(fila).join("")+"</div>"}
  $("#aL").innerHTML=h||'<div class="empty">Nada con ese nombre.</div>';
}
function fichaEj(n){
  const F=fichaDe(n);if(!F)return;hap();
  const nv=nivelDe(F),cam=SW&&SW.i>=0;
  hoja('<h2>'+esc(F.n)+'</h2>'+guiaHTML(F)+(F.c?'<p class="cue">'+esc(F.c)+"</p>":"")+
    '<div class="lh" style="margin-top:0">¿Lo dominas?</div><div class="seg u" id="nS">'+NIV.slice(0,3).map(([k,l])=>'<button data-n="'+k+'" class="'+(nv===k?"on":"")+'">'+l+"</button>").join("")+"</div>"+
    ytHTML(F,F.n)+
    (cam?'<button class="btn pri" onclick="aplicar(\''+jsq(F.n)+'\',\'hoy\')">Solo hoy</button><button class="btn s2" style="color:var(--orange)" onclick="aplicar(\''+jsq(F.n)+'\',\'fijo\')">Desde ahora · todos los '+DIA[entD].toLowerCase()+"</button>":"")+
    (F.mio?'<button class="btn dng" onclick="borrarEj(\''+jsq(F.n)+'\')">Borrar ejercicio</button>':"")+
    '<button class="btn s2" onclick="abrirArsenal()">Volver</button>');
  document.querySelectorAll("#nS button").forEach(b=>b.onclick=()=>{hap();const N=DB.get(K.niv,{});N[F.n]=b.dataset.n;DB.set(K.niv,N);
    document.querySelectorAll("#nS button").forEach(x=>x.classList.toggle("on",x===b))});
  fotoFallo();
}
function aplicar(n,modo){
  const C=cambios(),kf=entD+":"+SW.i,kh=entF+":"+kf,orig=RUTINA[entD].e[SW.i].n;
  delete C.hoy[kh];
  if(modo==="hoy"){if(n!==(C.fijo[kf]||orig))C.hoy[kh]=n}
  else if(n===orig)delete C.fijo[kf];else C.fijo[kf]=n;
  DB.set(K.cam,C);
  const F=fichaDe(n);if(F&&F.i)[0,1].forEach(k=>fetch(fotoEj(F.i,k)).catch(()=>{})); // que quede guardada para el gym
  cerrar();hap();render();
  toast(n===orig?"Volvió a "+n:modo==="hoy"?"Solo hoy · "+n:"Desde ahora · "+n);
}
function crearEj(){
  hoja('<h2>Crear ejercicio</h2><p class="p">Para una máquina o variante que no esté. Sin foto, pero con su búsqueda de videos.</p><div class="form">'+
    '<label>Nombre<input id="eN" placeholder="Ej. Remo en máquina Hammer" style="width:62%"></label>'+
    '<label>Músculo<select id="eG">'+GRUPOS.map(g=>'<option'+(g===SW.g?" selected":"")+">"+g+"</option>").join("")+"</select></label>"+
    '<label>¿Lo dominas?<select id="eL">'+NIV.slice(0,3).map(([k,l])=>'<option value="'+k+'">'+l+"</option>").join("")+"</select></label></div>"+
    '<textarea id="eC" class="ta2" placeholder="Cómo se hace (opcional)"></textarea><div style="height:14px"></div>'+
    '<button class="btn pri" onclick="guardarEj()">Guardar</button><button class="btn s2" onclick="abrirArsenal()">Cancelar</button>');
}
function guardarEj(){
  const n=cap(($("#eN").value||"").trim());if(!n){toast("Ponle nombre");return}
  if(fichaDe(n)){toast("Ya existe uno con ese nombre");return}
  const C=DB.get(K.ejc,[]);C.push({n,g:$("#eG").value,lv:$("#eL").value,c:($("#eC").value||"").trim(),q:n,mio:1});DB.set(K.ejc,C);
  SW.g=$("#eG").value;SW.q="";abrirArsenal();toast("Creado · "+n);
}
function borrarEj(n){const C=DB.get(K.ejc,[]).filter(x=>x.n!==n);DB.set(K.ejc,C);abrirArsenal();toast("Borrado")}
function verRutina(){
  const C=cambios(),fi=Object.entries(C.fijo);
  hoja('<h2>Tu rutina</h2><p class="p">Los cambios «desde ahora» quedan aquí. El bloque es hasta el 31 de octubre: cambia un ejercicio si la máquina no sirve, no la rutina entera.</p>'+
    (fi.length?'<div class="pvw">'+fi.map(([k,n])=>{const[d,i]=k.split(":").map(Number);return'<div class="r"><div class="tx"><b>'+esc(n)+"</b><small>"+DIA[d]+" · en vez de "+esc(RUTINA[d].e[i].n)+"</small></div></div>"}).join("")+"</div>":
      '<div class="card empty" style="background:var(--s2)">Sin cambios. Es la rutina original de rutina.md.</div>')+
    '<button class="btn pri" onclick="copiar(mdRutina(),\'Copiado. Pégalo en rutina.md\')">Copiar para Obsidian</button>'+
    (fi.length?'<button class="btn dng" id="vO" onclick="volverOriginal()">Volver todo al original</button>':"")+
    '<button class="btn s2" onclick="cerrar()">Cerrar</button>');
}
let VCONF=false;
function volverOriginal(){
  if(!VCONF){VCONF=true;$("#vO").textContent="Toca otra vez para confirmar";setTimeout(()=>{VCONF=false},4000);return}
  VCONF=false;const C=cambios();C.fijo={};DB.set(K.cam,C);cerrar();render();toast("Rutina original de vuelta");
}
function mdRutina(){
  return[1,2,3,4,5].map(d=>{const r=rutinaDe(d,"9999-12-31");
    return"## "+DIA[d].toUpperCase()+" — "+r.t+" · "+r.min+" min\n\n| # | Ejercicio | Series x Reps | Peso | Descanso |\n|---|---|---|---|---|\n"+
      r.e.map((x,i)=>"| "+(i+1)+" | "+x.n+" | "+x.s+" x "+x.r+" | "+(pesoDe(x)||"—")+" | "+x.d+" s |").join("\n")}).join("\n\n")+"\n";
}
function markdownSesion(){
  const r=R(),s=DB.get(K.ses,{})[entF];
  const L=r.e.map((ej,i)=>{const e=s&&s.ej[i];return"- "+ej.n+" · "+(e?e.hechas.length:0)+"x"+ej.r+" · "+(e&&e.peso?normPeso(e.peso):pesoDe(ej))}).join("\n");
  return"---\ntype: gym-sesion\nfecha: "+entF+"\nsesion: "+r.t+"\nduracion: "+(s&&s.t0?Math.max(1,Math.round((s.t1-s.t0)/60000)):"")+"\nsueno: \nenergia: \nnota: \n---\n\n# "+entF+" · "+r.t+"\n\n"+L+"\n\n**Cómo estuvo:** \n\n*[[🏋️ Gym|← Gym]] · [[rutina|Rutina]]*\n";
}
function terminar(){
  const r=R(),s=DB.get(K.ses,{})[entF];if(!s)return;
  pararTimer();wake(false);hap();
  const tot=seriesTot(r),hec=hechasSes(s),exc=r.e.filter((ej,i)=>s.ej[i]&&s.ej[i].hechas.length>=ej.s).length;
  const dur=s.t0&&s.t1?Math.max(1,Math.round((s.t1-s.t0)/60000)):null;
  hoja('<div class="fin">'+(hec>=tot?"🏆":"💪")+'</div><h2 style="text-align:center">'+(hec>=tot?"Entreno completo":"Buen trabajo")+'</h2>'+
    '<div class="m3"><div><small>Series</small><b>'+hec+"/"+tot+'</b></div><div><small>Ejercicios</small><b>'+exc+"/"+r.e.length+'</b></div><div><small>Duración</small><b>'+(dur?dur+" min":"—")+'</b></div></div>'+
    '<p class="p" style="text-align:center">'+(hec>=tot?"Si la próxima vez también completas todo con este peso, te aviso que toca subir.":"Cuenta como marca. Lo que importa es haber venido.")+'</p>'+
    '<button class="btn pri" onclick="copiar(markdownSesion(),\'Copiado. Pégalo en 📓 Sesiones/\')">Copiar para Obsidian</button><button class="btn s2" onclick="cerrar()">Listo</button>');
}

/* ═══════════════ COMIDA ═══════════════ */
function cDia(n){const nf=addD(comF,n);if(nf>hoy())return;hap();comF=nf;anim=false;render()}
function vComida(){
  const c=cfg(),m=metas(c),t=totDia(comF),es=comF===hoy(),L=entradas(comF),v=ventana();
  const rest=m.kcal-t.k;
  let h='<div class="eyebrow dnav"><button onclick="cDia(-1)">'+IC.izq+"</button><span>"+(es?"Hoy · ":"")+fechaLarga(comF)+'</span><button onclick="cDia(1)"'+(es?" disabled":"")+">"+IC.der+'</button></div><h1 class="lt">Comida</h1>';
  h+='<div class="card"><div class="krow"><div><div class="kbig">'+fmt(t.k)+"<span>/ "+fmt(m.kcal)+' kcal</span></div><div class="ksub" style="color:'+(rest<0?"var(--orange)":"var(--tx2)")+'">'+(rest>=0?"Quedan "+fmt(rest)+" kcal":fmt(-rest)+" kcal sobre la meta")+"</div></div>"+
     (es?'<div class="pill" style="--c:'+v.col+'"><i></i>'+v.t+"</div>":"")+"</div>"+
     '<div class="bar big" style="--c:'+(rest<0?"var(--orange)":"var(--red)")+'"><i style="width:'+Math.min(100,t.k/m.kcal*100)+'%"></i></div>'+
     '<div class="macros"><div style="--c:var(--green)"><small>Proteína</small><b>'+Math.round(t.p)+"</b><span>/"+m.prot+' g</span></div><div style="--c:var(--yellow)"><small>Carbos</small><b>'+Math.round(t.c)+'</b><span> g</span></div><div style="--c:var(--purple)"><small>Grasa</small><b>'+Math.round(t.f)+"</b><span> g</span></div></div></div>";
  h+='<div class="comp"><textarea id="cin" rows="1" placeholder="¿Qué comiste?" enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea><button id="cbtn" onclick="enviar()" disabled>'+IC.send+"</button></div>";
  h+='<div class="clab">Rápido</div><div class="chips">'+CHIPS.map((x,i)=>{const k=totales(parsear(x)).k;return'<button class="chip" onclick="rapido('+i+')">'+esc(x)+"<b>"+fmt(k)+"</b></button>"}).join("")+"</div>";
  REC=recientes();
  if(REC.length)h+='<div class="clab">Repetir</div><div class="chips">'+REC.map((e,i)=>'<button class="chip" onclick="repetir('+i+')">'+esc(e.txt)+"<b>"+fmt(e.k)+"</b></button>").join("")+"</div>";
  h+='<div class="sec">'+(es?"Hoy":"Ese día")+"<small>"+L.length+" "+(L.length===1?"registro":"registros")+"</small></div>";
  if(!L.length)h+='<div class="card empty">Escribe como hablas:<br><b style="color:var(--tx)">«2 palmas de pollo, 1 puño de arroz y queso»</b><br>Si algo no lo conozco, me lo enseñas una vez.</div>';
  else h+='<div class="list flat">'+L.map(e=>'<button class="ent" onclick="verEntrada(\''+e.id+'\')"><div class="h">'+(e.h||"—")+'</div><div class="tx"><b>'+esc(e.txt)+"</b><small>"+Math.round(e.p)+' g proteína</small></div><div class="k">'+fmt(e.k)+"</div></button>").join("")+"</div>";
  h+='<div class="card" style="margin-top:14px"><div style="font-weight:700;margin-bottom:6px">Tu plato</div><div class="p" style="margin:0">2 palmas de proteína · 1 puño de carbohidrato · 1 pulgar de grasa · un vaso de agua antes de empezar.<br><br><b style="color:var(--tx)">Sí:</b> pollo, carne, huevo, atún, whey, arroz, papa en air fryer, plátano verde, avena, queso blanco, aceite de oliva.</div></div>';

    return'<div class="r"><div class="tx"><b>'+esc(x.n)+"</b><small>"+esc(x.q)+(x.g&&!x.cu?" · "+x.g+" g":"")+'</small></div><div class="k"><b>'+fmt(x.k)+" kcal</b><small>"+Math.round(x.p)+" g prot</small></div></div>";
  }).join("")+(ok.length>1?'<div class="r tot"><div class="tx"><b>Total</b></div><div class="k"><b>'+fmt(T.k)+" kcal</b><small>"+Math.round(T.p)+" g prot</small></div></div>":"")+"</div>";

function guardarAlim(i){
  const n=($("#tN").value||"").trim(),k=parseFloat(($("#tK").value||"").replace(",",".")),p=parseFloat(($("#tP").value||"0").replace(",","."))||0;

function grafico(bw,col,gid,vacio){
  const ks=Object.keys(bw).sort().slice(-60);
  if(ks.length<2)return'<div class="hint" style="text-align:left;padding:12px 0 0">'+(ks.length?"Con un segundo registro aparece la curva.":vacio)+"</div>";
  const vs=ks.map(k=>bw[k]),mn=Math.min(...vs),mx=Math.max(...vs),pad=Math.max(.6,(mx-mn)*.2),lo=mn-pad,hi=mx+pad;
  const W=320,H=120,x=i=>(i/(ks.length-1))*(W-12)+6,y=v=>H-8-((v-lo)/(hi-lo))*(H-16);
  const pts=vs.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1));
  const area="M"+pts[0]+" L"+pts.join(" L")+" L"+x(vs.length-1).toFixed(1)+","+H+" L"+x(0).toFixed(1)+","+H+" Z";
  return'<svg class="chart" viewBox="0 0 '+W+" "+(H+18)+'"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".35"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+gid+')"/><polyline points="'+pts.join(" ")+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+x(vs.length-1)+'" cy="'+y(vs[vs.length-1])+'" r="5" fill="'+col+'" stroke="#1c1c1e" stroke-width="2.5"/>'+
    '<text x="6" y="'+(H+15)+'" fill="rgba(235,235,245,.35)" font-size="11">'+dm(ks[0])+'</text><text x="'+(W-6)+'" y="'+(H+15)+'" fill="rgba(235,235,245,.35)" font-size="11" text-anchor="end">'+dm(ks[ks.length-1])+"</text></svg>";
}
function vProgreso(){
  const bw=DB.get(K.bw,{}),ks=Object.keys(bw).sort(),act=pesoActual(),S=DB.get(K.ses,{});
  let h='<div class="eyebrow">'+fechaLarga(hoy())+'</div><h1 class="lt">Progreso</h1>';
  const dlt=ks.length>1?bw[ks[ks.length-1]]-bw[ks[0]]:null;
  h+='<div class="card"><div class="krow"><div><div style="font-size:13px;font-weight:600;color:var(--orange)">Peso corporal</div><div class="wbig" style="margin-top:6px">'+fmt1(act)+"<span>kg</span></div>"+
     '<div class="ksub" style="color:'+(dlt===null?"var(--tx2)":dlt<=0?"var(--green)":"var(--orange)")+'">'+(dlt===null?(ks.length?"Registrado el "+dm(ks[0]):"Último dato: abril, 92 kg"):(dlt<=0?"−":"+")+fmt1(Math.abs(dlt))+" kg desde el "+dm(ks[0]))+'</div></div>'+
     '<button class="pill" style="--c:var(--orange);font-size:14px" onclick="registrarPeso()"><i></i>Pesarme</button></div>'+grafico(bw,"#ff9f0a","gw","Pésate en ayunas, al levantarte, una vez por semana.")+"</div>";
  // cintura: baja aunque la báscula no se mueva, por eso va al lado del peso
  const ci=DB.get(K.cin,{}),cks=Object.keys(ci).sort(),cdl=cks.length>1?ci[cks[cks.length-1]]-ci[cks[0]]:null;
  h+='<div class="card"><div class="krow"><div><div style="font-size:13px;font-weight:600;color:var(--cyan)">Cintura</div><div class="wbig" style="margin-top:6px">'+(cks.length?fmt1(ci[cks[cks.length-1]]):"—")+"<span>cm</span></div>"+
     '<div class="ksub" style="color:'+(cdl===null?"var(--tx2)":cdl<=0?"var(--green)":"var(--orange)")+'">'+(cdl===null?(cks.length?"Medida el "+dm(cks[0]):"Sin medir todavía"):(cdl<=0?"−":"+")+fmt1(Math.abs(cdl))+" cm desde el "+dm(cks[0]))+'</div></div>'+
     '<button class="pill" style="--c:var(--cyan);font-size:14px" onclick="medirCintura()"><i></i>Medirme</button></div>'+grafico(ci,"#64d2ff","gc","Mídete una vez por semana, el mismo día que te pesas.")+"</div>";
  // constancia 8 semanas
  const lun=lunesDe(hoy()),sem=[];
  for(let w=7;w>=0;w--){const l=addD(lun,-7*w);let n=0;for(let d=0;d<7;d++)if(entrenoEn(addD(l,d)))n++;sem.push({l,n})}
  const prom=sem.slice(0,7).reduce((a,x)=>a+x.n,0)/7;
  h+='<div class="sec">Constancia<small>meta 3 por semana</small></div><div class="card"><div class="bars">'+
     sem.map(x=>'<div><em>'+(x.n||"")+'</em><i class="'+(x.n>=3?"met":x.n?"":"cero")+'" style="height:'+Math.max(4,x.n/5*100)+'%"></i><small>'+(+x.l.slice(8))+"/"+(+x.l.slice(5,7))+"</small></div>").join("")+
     '</div><div class="hint" style="text-align:left;padding:12px 0 0">Promedio de las últimas 7 semanas: <b style="color:var(--tx)">'+fmt1(prom)+"</b> entrenos.</div></div>";
  // récords
  const best={};
  for(const f of Object.keys(S))for(const e of S[f].ej){if(!e.hechas.length||!e.peso)continue;const m=String(e.peso).match(/(\d+(?:[.,]\d+)?)/);if(!m)continue;
    const v=parseFloat(m[1].replace(",","."));if(!best[e.n]||v>best[e.n].v||(v===best[e.n].v&&f>best[e.n].f))best[e.n]={v,p:e.peso,f}}
  const rec=Object.entries(best).sort((a,b)=>b[1].f.localeCompare(a[1].f)).slice(0,10);
  h+='<div class="sec">Mejores pesos</div>'+(rec.length?'<div class="list flat">'+rec.map(([n,b])=>'<div class="row"><div class="tx"><b>'+esc(n)+"</b><small>"+dm(b.f)+'</small></div><div class="val" style="color:var(--tx);font-weight:700">'+esc(normPeso(b.p))+"</div></div>").join("")+"</div>":'<div class="card empty">Aparecen cuando marques series en Entreno.</div>');
  // historial
  const fs=Object.keys(S).sort().reverse().slice(0,20);
  h+='<div class="sec">Sesiones<small>'+Object.keys(S).length+" en total</small></div>"+(fs.length?'<div class="list flat">'+fs.map(f=>{const s=S[f],r=RUTINA[s.dia],tot=r?seriesTot(r):0,hec=hechasSes(s),pct=tot?Math.round(hec/tot*100):0;
    return'<div class="row"><div class="tx"><b>'+esc(s.t)+"</b><small>"+fechaLarga(f)+" · "+hec+" de "+tot+' series</small></div><div class="val" style="font-weight:800;color:'+(pct>=100?"var(--green)":pct>=50?"var(--yellow)":"var(--tx2)")+'">'+pct+"%</div></div>"}).join("")+"</div>":'<div class="card empty">Todavía no hay sesiones.</div>');
  // ajustes
  h+='<div class="sec">Ajustes</div><div class="list">'+
     '<button class="row" onclick="ajustes()"><div class="ico" style="--c:#8e8e93">'+IC.gear+'</div><div class="tx"><b>Metas y cuerpo</b><small>'+fmt(metas().kcal)+" kcal · "+cfg().prot+' g proteína</small></div>'+IC.chev+"</button>"+
     '<button class="row" onclick="verArsenal()"><div class="ico" style="--c:#bf5af2">'+IC.entreno+'</div><div class="tx"><b>Arsenal de ejercicios</b><small>'+arsenal().length+' con foto y técnica</small></div>'+IC.chev+"</button>"+
     '<button class="row" onclick="verRutina()"><div class="ico" style="--c:#ff9f0a">'+IC.lista+'</div><div class="tx"><b>Tu rutina</b><small>'+(Object.keys(cambios().fijo).length||"Sin")+" cambios · copiar para Obsidian</small></div>"+IC.chev+"</button>"+
     '<button class="row" onclick="misAlimentos()"><div class="ico" style="--c:#30d158">'+IC.libro+'</div><div class="tx"><b>Mis alimentos</b><small>'+DB.get(K.cus,[]).length+' enseñados</small></div>'+IC.chev+"</button>"+
     '<button class="row" onclick="respaldo()"><div class="ico" style="--c:#0a84ff">'+IC.caja+'</div><div class="tx"><b>Copia de seguridad</b><small>Todo vive solo en este teléfono</small></div>'+IC.chev+"</button></div>";
  return[h,"Progreso"];
}

  if(!RCONF){RCONF=true;$("#rBtn").textContent="Toca otra vez para reemplazar todo";$("#rBtn").classList.add("dng");setTimeout(()=>{RCONF=false},5000);return}
  RCONF=false;for(const k of Object.values(K)){const v=j.datos[k];if(v==null)localStorage.removeItem(k);else DB.set(k,v)}
  INDICE=null;cerrar();anim=true;render();toast("Restaurado del "+(j.fecha||"respaldo"));
}

/* ═══════════════ arranque ═══════════════ */
$("#tabs").innerHTML=[["hoy","Hoy"],["entreno","Entreno"],["comida","Comida"],["progreso","Progreso"]]
  .map(([k,l])=>'<button data-t="'+k+'" class="'+(k===tab?"on":"")+'" onclick="ir(\''+k+'\')">'+IC[k]+l+"</button>").join("");
render();
setInterval(()=>{if(document.visibilityState==="visible"&&tab==="hoy"&&!$("#sh").classList.contains("on"))render()},60000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
